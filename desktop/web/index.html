<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLI Resume</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-amber.css">
<link rel="stylesheet" href="theme-xp.css">
<link rel="stylesheet" href="theme-win98.css">
<link rel="stylesheet" href="vendor/xterm.css">
<script>
// 主题的真相存在 settings.json 里，但要等一次网络往返才知道；
// 先在 head 里用上次的值把 data-skin 摆好，否则每次启动都会先画一帧紫黑再跳成灰。
(function () {
  try {
    var t = localStorage.getItem('cli-resume-theme');
    if (t && ['neon', 'amber', 'win98', 'xp'].indexOf(t) >= 0) {
      document.documentElement.dataset.skin = t;
    }
  } catch (e) { /* 隐私模式下 localStorage 可能不可用，退回默认主题 */ }
})();
</script>
</head>
<body>
<div class="crt">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <rect x="3" y="6" width="3" height="3"/><rect x="6" y="9" width="3" height="3"/>
          <rect x="6" y="12" width="3" height="3"/><rect x="3" y="15" width="3" height="3"/>
          <rect x="12" y="15" width="8" height="3"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>CLI<i>//</i>RESUME</h1>
        <p>RESTORE TERMINAL SESSION</p>
      </div>
    </div>

    <div class="status">
      <span class="lamp pwr" title="电源"></span>
      <span class="lamp act" title="扫描中"></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>

    <div class="top-actions">
      <div class="search">
        <span class="prompt">&gt;</span>
        <input id="search" type="text" placeholder="搜索目录或标题，回车搜正文" spellcheck="false">
        <span class="kbd">/</span>
      </div>
      <button id="stats-btn" class="icon-btn" title="Token / 成本统计">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <rect x="3" y="13" width="4" height="8"/><rect x="10" y="8" width="4" height="13"/>
          <rect x="17" y="4" width="4" height="17"/>
        </svg>
      </button>
      <button id="term-btn" class="icon-btn" title="打开内嵌终端">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <rect x="3" y="4" width="18" height="2"/><rect x="3" y="18" width="18" height="2"/>
          <rect x="3" y="4" width="2" height="16"/><rect x="19" y="4" width="2" height="16"/>
          <rect x="6" y="8" width="2" height="2"/><rect x="8" y="10" width="2" height="2"/>
          <rect x="6" y="12" width="2" height="2"/><rect x="12" y="13" width="6" height="2"/>
        </svg>
      </button>
      <button id="theme-btn" class="icon-btn" title="切换外观主题">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <rect x="3" y="4" width="8" height="7"/><rect x="13" y="4" width="8" height="7" opacity=".4"/>
          <rect x="3" y="13" width="8" height="7" opacity=".4"/><rect x="13" y="13" width="8" height="7"/>
        </svg>
      </button>
      <button id="refresh" class="icon-btn" title="重新扫描">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="square">
          <path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="跳到设置">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="square">
          <path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h9M17 17h3"/>
          <rect x="14" y="5" width="3" height="4"/><rect x="8" y="10" width="3" height="4"/>
          <rect x="13" y="15" width="3" height="4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="body">

    <aside class="rail">
      <div class="rail-hd"><span>CONTROL</span><i></i></div>

      <section class="rail-sec">
        <h3>RANGE</h3>
        <div class="seg" id="range">
          <button data-range="1"><span>今天</span><em>1D</em></button>
          <button data-range="168"><span>7 天</span><em>7D</em></button>
          <button data-range="720" class="on"><span>30 天</span><em>30D</em></button>
          <button data-range="0"><span>全部</span><em>ALL</em></button>
        </div>
      </section>

      <section class="rail-sec">
        <h3>RESTORE</h3>
        <button id="restore-all" class="primary small block">一键恢复</button>
        <p class="rail-hint" id="restore-hint">按最近的会话依次打开</p>
      </section>

      <section class="rail-sec">
        <h3>WORKSPACE</h3>
        <button id="ws-add" class="primary small block">＋ 新建工作空间</button>

        <div id="ws-form" hidden>
          <div class="field">
            <label>目录</label>
            <input id="ws-path" type="text" spellcheck="false" placeholder="D:\work\new-project">
          </div>
          <div class="ws-form-row">
            <button id="ws-browse" class="mini-btn">浏览…</button>
            <label class="chip-opt"><input type="checkbox" id="ws-create"><span>不存在就建</span></label>
          </div>
          <div class="ws-form-actions">
            <button id="ws-ok" class="primary small">添加</button>
            <button id="ws-cancel" class="mini-btn">取消</button>
          </div>
        </div>
      </section>

      <section class="rail-sec">
        <h3>DIAGNOSTIC</h3>
        <div id="doctor" class="doctor"></div>
      </section>

      <section class="rail-sec" id="drawer">
        <h3>SETTINGS<a id="drawer-close" class="mini-x" title="取消高亮">×</a></h3>

        <div class="field">
          <label>默认时间范围</label>
          <select id="set-range">
            <option value="1">今天</option>
            <option value="168">最近 7 天</option>
            <option value="720">最近 30 天</option>
            <option value="0">全部</option>
          </select>
        </div>
        <div class="field">
          <label>外观主题</label>
          <select id="set-theme">
            <option value="neon">80s 霓虹 CRT</option>
            <option value="amber">70s 琥珀终端</option>
            <option value="win98">Windows 98</option>
            <option value="xp">Windows XP Luna</option>
          </select>
        </div>
        <div class="field">
          <label>进入方式</label>
          <select id="set-term">
            <option value="embedded">应用内终端（可并排分屏）</option>
            <option value="external">Windows Terminal 新窗口</option>
            <option value="term">独立终端窗口（最多 6 个）</option>
          </select>
        </div>
        <div class="field">
          <label>启动时</label>
          <select id="set-restore">
            <option value="1">恢复上次的终端窗格</option>
            <option value="0">不恢复，只开空界面</option>
          </select>
        </div>
        <div class="field">
          <label>外部终端窗口</label>
          <select id="set-window">
            <option value="0">当前窗口开新标签页</option>
            <option value="-1">新开一个窗口</option>
            <option value="1">窗口 1</option>
          </select>
        </div>
        <div class="field">
          <label>本地模型地址</label>
          <input id="set-llm-url" type="text" spellcheck="false" placeholder="http://127.0.0.1:11434">
        </div>
        <div class="field">
          <label>模型 <span class="hint">留空自动选</span></label>
          <input id="set-llm-model" type="text" spellcheck="false" placeholder="qwen3:8b">
        </div>
        <div class="field">
          <label>开机自启</label>
          <select id="set-auto">
            <option value="0">关闭</option>
            <option value="1">开机后驻留托盘</option>
          </select>
        </div>
        <div class="field">
          <label>排除规则 <span class="hint">一行一个</span></label>
          <textarea id="set-exclude" rows="3" spellcheck="false" placeholder="\node_modules\&#10;\Temp\\"></textarea>
        </div>
        <button id="set-save" class="primary small">保存设置</button>
      </section>

      <div class="rail-foot">
        <span><b>/</b> 搜索</span>
        <span><b>^A</b> 全选</span>
        <span><b>^ENT</b> 恢复</span>
        <span><b>ESC</b> 取消</span>
      </div>
    </aside>

    <main class="screen">
      <div class="screen-hd">
        <span class="cmd">C:\&gt; cli-resume --scan</span>
        <span class="only-chip" id="only-chip" hidden>
          工作区 · <b id="only-name"></b>
          <button id="only-clear" title="在这个窗口里显示全部目录">×</button>
        </span>
        <span class="meta" id="meta"></span>
      </div>

      <div id="list" class="list"></div>

      <footer class="deck">
        <label class="sel-all">
          <input type="checkbox" id="sel-all">
          <span id="sel-label">全选</span>
        </label>
        <div class="opts">
          <label class="chip-opt"><input type="checkbox" id="opt-two"><span>同目录两个 CLI 各进一个</span></label>
          <label class="chip-opt"><input type="checkbox" id="opt-cont"><span>用 -c 续接最近会话</span></label>
          <label class="chip-opt"><input type="checkbox" id="opt-fav"><span>只看收藏</span></label>
        </div>
        <button id="open-btn" class="primary" disabled>
          <span id="open-text">进入对话</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <rect x="4" y="11" width="12" height="2"/><rect x="14" y="7" width="2" height="3"/>
            <rect x="16" y="9" width="2" height="2"/><rect x="16" y="13" width="2" height="2"/>
            <rect x="14" y="14" width="2" height="3"/>
          </svg>
        </button>
      </footer>
    </main>

  </div>

  <section class="termdock" id="termdock" hidden>
    <div class="term-drag" id="term-drag" title="拖动调整高度"></div>
    <div class="term-bar">
      <div class="term-tabs" id="term-tabs"></div>
      <div class="term-tools">
        <button class="mini-btn" id="term-pop" title="把终端弹到独立窗口（可放 6 个）">&#8663;</button>
        <button class="mini-btn" id="term-split" title="并排再开一个（同目录）">&#9707;</button>
        <button class="mini-btn" id="term-copy" title="复制选中的内容（Ctrl+Shift+C）">&#10697;</button>
        <button class="mini-btn" id="term-new" title="新终端（用户主目录）">+</button>
        <button class="mini-btn" id="term-hide" title="收起终端面板">&#9662;</button>
      </div>
    </div>
    <div class="term-grid" id="term-grid"></div>
  </section>

  <div class="crt-lines" aria-hidden="true"></div>
  <div class="crt-roll" aria-hidden="true"></div>
</div>

<div id="cli-menu" class="cli-menu" hidden></div>
<div id="toast" class="toast"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
