<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLI Resume</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7l4 5-4 5"/><path d="M12 17h8"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>CLI Resume</h1>
        <p>重启后，把上次的终端现场拉回来</p>
      </div>
    </div>

    <div class="top-actions">
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="text" placeholder="搜索目录（/ 聚焦）" spellcheck="false">
      </div>
      <button id="refresh" class="icon-btn" title="重新扫描">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="设置">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1.3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3a1.7 1.7 0 0 0 1-1.6V1.3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 3a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 9v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.2.9z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="range">
      <button data-range="1">今天</button>
      <button data-range="168">7 天</button>
      <button data-range="720" class="on">30 天</button>
      <button data-range="0">全部</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <main id="list" class="list"></main>

  <footer class="actionbar">
    <label class="sel-all">
      <input type="checkbox" id="sel-all">
      <span id="sel-label">全选</span>
    </label>
    <div class="opts">
      <label class="chip-opt"><input type="checkbox" id="opt-two"><span>同目录两个 CLI 各进一个</span></label>
      <label class="chip-opt"><input type="checkbox" id="opt-cont"><span>用 -c 续接最近会话</span></label>
    </div>
    <button id="open-btn" class="primary" disabled>
      <span id="open-text">进入对话</span>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </footer>

</div>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>设置</h2>
    <button id="drawer-close" class="icon-btn" title="关闭">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label>默认时间范围</label>
      <select id="set-range">
        <option value="1">今天</option>
        <option value="168">最近 7 天</option>
        <option value="720">最近 30 天</option>
        <option value="0">全部</option>
      </select>
    </div>
    <div class="field">
      <label>默认终端窗口</label>
      <select id="set-window">
        <option value="0">当前窗口开新标签页</option>
        <option value="-1">新开一个窗口</option>
        <option value="1">窗口 1</option>
      </select>
    </div>
    <div class="field">
      <label>排除规则 <span class="hint">路径里含这些词的直接跳过，一行一个</span></label>
      <textarea id="set-exclude" rows="5" spellcheck="false"></textarea>
    </div>

    <div class="field">
      <label>环境自检</label>
      <div id="doctor" class="doctor"></div>
    </div>
  </div>
  <div class="drawer-foot">
    <button id="set-save" class="primary small">保存设置</button>
  </div>
</aside>
<div id="overlay" class="overlay"></div>

<div id="toast" class="toast"></div>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
